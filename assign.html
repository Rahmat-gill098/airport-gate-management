<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assign Gate | AeroGate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">Aero<span>Gate</span> Control</div>
    <nav>
      <ul>
        <li><a href="index.html">Gate Dashboard</a></li>
        <li><a href="assign.html" class="active">Assign Gate</a></li>
        <li><a href="departures.html">Passenger Board</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="form-container">
      <h2>Assign Flight to Boarding Gate</h2>
      <p style="color: #337ee7; margin-bottom: 1.5rem;">Only currently available gates are eligible for allocation.</p>

      <!-- Submitting redirects directly to confirmation.html -->
      <form action="confirmation.html" method="get">
        <div class="form-row">
          <div class="form-group">
            <label for="flightNo">Flight Number *</label>
            <input type="text" id="flightNo" name="flightNo" placeholder="e.g., UK-814" required>
          </div>

          <div class="form-group">
            <label for="airline">Airline *</label>
            <select id="airline" name="airline" required>
              <option value="">-- Select Airline --</option>
              <option value="Air India">Air India</option>
              <option value="IndiGo">IndiGo</option>
              <option value="SpiceJet">SpiceJet</option>
              <option value="Akasa Air">Akasa Air</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="destination">Destination Airport *</label>
            <input type="text" id="destination" name="destination" placeholder="e.g., Bengaluru (BLR)" required>
          </div>

          <div class="form-group">
            <label for="gate">Select Available Gate *</label>
            <select id="gate" name="gate" required>
              <option value="">-- Choose Open Gate --</option>
              <option value="Gate A2">Gate A2 (Available - Narrow Body)</option>
              <option value="Gate A3">Gate A3 (Available - Wide Body)</option>
              <option value="Gate B3">Gate B3 (Available - Narrow Body)</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="arrival">Gate Docking Time *</label>
            <input type="time" id="arrival" name="arrival" required>
          </div>

          <div class="form-group">
            <label for="departure">Scheduled Departure *</label>
            <input type="time" id="departure" name="departure" required>
          </div>
        </div>

        <button type="submit" class="btn" style="width: 20%;">Confirm Gate Allocation</button>
      </form>
    </div>
  </main>

  <footer>
    <p> 2026 Airport Gate Management System | Course Project</p>
  </footer>

</body>
</html>
